name: Renderer CI
on:
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify:
    name: Renderer checks
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      OPTIX_ROOT: ${{ github.workspace }}/target/optix-dev
      CUDARC_CUDA_VERSION: '12080'
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch OptiX 9 headers
        run: |
          git clone --depth 1 --branch v9.0.0 https://github.com/NVIDIA/optix-dev.git "$env:OPTIX_ROOT"
          if ((git -C "$env:OPTIX_ROOT" rev-parse HEAD) -ne 'fff65c2a7c592f1ea5f1661ad7d2381cf965f9bd') { throw 'Unexpected OptiX revision' }
      - name: Cache deslop-please
        id: lint-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/deslop-please.exe
          key: deslop-please-windows-0.1.4
      - name: Install deslop-please
        if: steps.lint-cache.outputs.cache-hit != 'true'
        run: cargo install --locked deslop-please --version 0.1.4
      - name: Check architecture with deslop-please
        run: deslop-please --features python
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p vibrt-nodes
      - run: python scripts/check_struct_layouts.py
      - run: python -m pip install numpy
      - name: Test Python exporter
        shell: bash
        run: for suite in blender/vibrt_blender/test_*.py; do python "$suite" || exit 1; done
